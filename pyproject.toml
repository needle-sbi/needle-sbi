[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "preprocessor/tests"]
addopts = "-ra --tb=short --disable-warnings"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = false

[tool.flake8]
max_line_length = 120
extend_ignore = ["E203", "W503"]

[[tool.mypy.overrides]]
module = ["dask.*", "dask_awkward.*"]
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "preprocessor",
    "ml",
]

[dependency-groups]
dev = [
    "snakeviz>=2.2.2",
]
