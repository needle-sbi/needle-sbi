[build-system]
requires = ["hatchling"]          # use a hatchling backend
build-backend = "hatchling.build"

[project]
name = "needle-orchestrator"
version = "0.0.0"
description = "Workflow manager for NEEDLE"
authors = []
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # data / HEP
    "awkward>=2.7",
    "dask[distributed]>=2025.2",
    "dask-awkward>=2025.2",
    "pyarrow>=19.0",
    "uproot>=5.6",
    # ml related packages
    "torch>=2.7",
    "lightning>=2.5.6",
    "zuko>=1.3",        # -> for normalising flows
    # configuration and workflow related packages
    "hydra-core>=1.3.2",
    "law>=0.1.20",
    "luigi>=3.6",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    # experiment tracking and visualisation
    "mlflow>=3.5.1",
    "tensorboard>=2.19",
    "matplotlib>=3.10",
    # misc and useful packages
    "numpy>=2.2",
    "pandas>=2.2",
    "psutil>=7.0",
    "graphviz>=0.21",
    "plotly>=6.6.0",
    "tabulate>=0.9.0",
    "mplhep>=0.4.1",
    "seaborn>=0.13.2",
    "ipykernel>=6.29.5",
    "ipython>=9.0.2",
    "fair-universe-demo",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "debugpy>=1.8",
    "flake8>=7.1",
    "flake8-debugger>=4.1",
    "ipykernel>=6.29",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-cov >=3",
    "pytest-benchmark[histogram]>=5.2",
    "snakeviz>=2.2.2",
    "torch-tb-profiler>=0.4.3",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=0.13",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
    "myst-nb>=1.1.0",
    "sphinx-design",
    "furo>=2023.08.17",
    "pydata-sphinx-theme>=0.13.0",
    "sphinx-togglebutton",
    "rich>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "law_tasks"]

[tool.uv.workspace]
members = ["preprocessor", "ml", "examples/fair_universe_demo"]

[tool.uv.sources]
fair-universe-demo = {editable = true, workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "preprocessor/tests"]
addopts = "-ra --tb=short --disable-warnings --benchmark-skip --benchmark-autosave -m='not slow'"
markers = ["slow"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["dask.*", "dask_awkward.*"]
ignore_missing_imports = true

[tool.flake8]
max_line_length = 120
extend_ignore = ["E203", "W503", "E704", "E123", "W293"]
