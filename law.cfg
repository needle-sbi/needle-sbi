[modules]
law_tasks

[job]
job_file_dir: ../jobs
job_file_cleanup: False

[logging]
luigi-interface: DEBUG

[luigi_core]
workers: 4
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0

[htcondor]
# Simple HTCondor remote execution (no workflow refactoring needed!)
# Just add --scheduler htcondor to any law run command
request_cpus: 2
request_memory: 32000
request_GPUs: 0
universe: vanilla
getenv: True
+Environment: "FAIR_UNIVERSE_DATA=/data/dust/group/atlas/needle/FAIRUnv/UncertaintyChallenge_2024/ProcessedData_v1_2025-10-03/CombData-part0.parquet"
+Request_Runtime: 7200