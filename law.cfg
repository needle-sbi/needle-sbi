[modules]
law_tasks

[job]
job_file_dir: ../jobs
job_file_cleanup: False

[logging]
luigi-interface: DEBUG

[luigi_core]
workers: 4
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0

[EnsembleTask]
# Default workflow for EnsembleTask
# HTCondor is the default (rightmost parent class in inheritance)
# Use --EnsembleTask-workflow local for local testing
workflow: local

[htcondor]
# HTCondor workflow configuration for LAW remote execution
# These settings are used when --workflow htcondor is specified

# Bootstrap environment on remote nodes
bootstrap_file: $PWD/setup.sh

# Poll HTCondor queue status every 30 seconds
poll_interval: 30

# Submit up to 50 jobs at once
parallel_jobs: 50

# Output directory for HTCondor logs and submission files
output_uri: $PWD/.law/htcondor

# Capture job logs (stdout, stderr, HTCondor log)
log_file: job_${{file_postfix}}.log
stdout: job_${{file_postfix}}.out  
stderr: job_${{file_postfix}}.err

# Default resource requests (can be overridden per-task via htcondor_job_config)
request_cpus: 2
request_memory: 16000
request_runtime: 7200
request_GPUs: 0

# HTCondor universe
universe: vanilla

# Pass environment variables to jobs
getenv: True