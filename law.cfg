[modules]
law_tasks

[job]
job_file_dir: ../jobs
job_file_cleanup: False

[logging]
luigi-interface: DEBUG

[luigi_core]
workers: 4
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0

[FoldTask]
workflow: htcondor
htcondor_request_cpus: 2
htcondor_request_memory: 32000
max_runtime: 120.0m