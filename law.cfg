[modules]
law_tasks

[job]
job_file_dir: runs/law_outputs
job_file_cleanup: False
poll_interval: 30s
retries: 2

[logging]
luigi-interface: INFO
law: INFO

[luigi_core]
workers: 4
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0

[luigi_FoldTask_slurm]
# Settings for running on KIT Horeka and DESY Maxwell
# https://www.nhr.kit.edu/userdocs/horeka/batch/
# https://docs.desy.de/maxwell/documentation/
# ingested by law_tasks.workflows.slurm.SlurmWorkflow
nodes: 1
time: 60  # seconds
ntasks: 1
job-name: "NEEDLE-fair-universe"
partition: "cpuonly"
mem-per-cpu: 2000  # MB

[luigi_FoldTask_htcondor]
# Settings for running on DESY NAF
# https://docs.desy.de/naf/documentation/cheat-sheet/
# ingested by law_tasks.workflows.htcondor.HTCondorWorkflow
RequestRuntime: 600  # s
RequestMemory: 2048  # MiB
RequestDisk: 10000000  # kB
RequestCpus: 2
RequestGPUs: 1  # 1080ti on NAF
