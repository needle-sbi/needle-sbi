[modules]
law_tasks

[job]
job_file_dir: runs/law_outputs
job_file_cleanup: False
poll_interval: 30s
retries: 2

[logging]
luigi-interface: INFO
law: INFO

[luigi_core]
workers: 4
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0

[luigi_FoldTask_slurm]
# Settings for running on KIT Horeka
# https://www.nhr.kit.edu/userdocs/horeka/batch/
# ingested by law_tasks.workflows.slurm.SlurmWorkflow
nodes: 1
time: 600  # seconds
ntasks: 1
job-name: "NEEDLE-fair-universe"
partition: "cpuonly"
mem-per-cpu: 2000  # MB

[luigi_FoldTask_htcondor]
# Settings for running on DESY NAF (and other htcondor-based schedulers)
# https://docs.desy.de/naf/documentation/cheat-sheet/
# ingested by law_tasks.workflows.htcondor.HTCondorWorkflow

# Runtime (also called +RequestWalltime) in seconds
Request_Runtime: 600
# RAM in MiB
Request_Memory: 2048
# Disk space in MB
Request_Disk: 3000
Request_Cpus: 2