[modules]
law_tasks

[job]
job_file_dir: $SCRIPT_DIR/runs/law_outputs
job_file_cleanup: False
poll_interval: 30s
retries: 2

[logging]
luigi-interface: INFO
law: INFO

[luigi_core]
workers: 4
local_scheduler: True
no_lock: True

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

[luigi_scheduler]
retry_count: 0
