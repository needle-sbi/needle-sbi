[project]
name = "fair-universe-demo"
version = "0.1.0"
description = "A pure Lightning implementation of the Contrastive Normalizing Flow solution for FAIR Universe HiggsML Challenge"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "awkward>=2.7",
    "pyarrow>=19.0",
    "torch>=2.7",
    "lightning>=2.5.6",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "mlflow>=3.5.1",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "psutil>=7.0",
    "graphviz>=0.21",
    "plotly>=6.6.0",
    "pre-commit>=4.1.0",
]
